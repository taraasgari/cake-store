{% extends 'perfume_base.html' %}

{% block title %}🔑 تنظیم رمز عبور جدید{% endblock %}

{% block content %}
<div class="min-h-[70vh] flex items-center justify-center py-12">
    <div class="w-full max-w-md">
        <div class="bg-white/80 backdrop-blur-xl rounded-3xl shadow-2xl p-8 border border-white/20">
            <div class="text-center mb-6">
                <i class="fas fa-lock text-5xl text-pink-500 mb-4"></i>
                <h1 class="text-3xl font-bold gradient-text">🔑 تنظیم رمز جدید</h1>
                <p class="text-gray-500 mt-2">رمز عبور جدید خود را وارد کنید</p>
            </div>
            
            <form method="POST">
                {% csrf_token %}
                <div class="space-y-4">
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">رمز عبور جدید</label>
                        <input type="password" name="new_password1" required
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-pink-500 focus:ring-4 focus:ring-pink-100 transition-all outline-none bg-white/50"
                               placeholder="رمز عبور جدید را وارد کنید">
                    </div>
                    <div>
                        <label class="block text-sm font-bold text-gray-700 mb-2">تکرار رمز عبور</label>
                        <input type="password" name="new_password2" required
                               class="w-full px-4 py-3 border-2 border-gray-200 rounded-xl focus:border-pink-500 focus:ring-4 focus:ring-pink-100 transition-all outline-none bg-white/50"
                               placeholder="رمز عبور را مجدداً وارد کنید">
                    </div>
                    <button type="submit" class="w-full py-3 bg-gradient-to-r from-pink-500 to-purple-600 text-white rounded-xl font-bold hover:shadow-xl transition-all hover:scale-105">
                        <i class="fas fa-save ml-2"></i> تغییر رمز عبور
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
