[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "shop-core"
version = "0.1.0"
description = "Reusable Django commerce core"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10,<12",
    "Django>=5.2,<6.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
